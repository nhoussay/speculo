apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: speculod-blockchain-with-faucet
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/cpu-throttling: "false"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu: "2"
        run.googleapis.com/memory: "4Gi"
        run.googleapis.com/max-scale: "1"
        run.googleapis.com/min-scale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/session-affinity: "true"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 3600
      containers:
      - image: gcr.io/speculo-blockchain/speculod:latest
        name: speculod-full
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: DEPLOYMENT_MODE
          value: "cloud"
        - name: CHAIN_ID
          value: "speculod"
        - name: MONIKER
          value: "speculod-gcp-full"
        - name: CONTAINER_NAME
          value: "localhost"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: speculod-data
          mountPath: /home/speculod/.speculod
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: speculod-data
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
  traffic:
  - percent: 100
    latestRevision: true
