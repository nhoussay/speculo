[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:blockchain]
command=/bin/bash /usr/local/bin/cloud-startup.sh
user=speculod
directory=/home/speculod
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=3
priority=100
environment=DEPLOYMENT_MODE="cloud",CONTAINER_NAME="localhost"

[program:faucet]
command=/usr/bin/python3 /usr/local/bin/faucet-server.py
user=speculod
directory=/home/speculod
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startretries=3
priority=200
environment=CONTAINER_NAME="localhost"
