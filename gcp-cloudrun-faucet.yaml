apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: speculod-faucet
  labels:
    component: token-faucet
    app: speculod
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      labels:
        component: token-faucet
        app: speculod
      annotations:
        run.googleapis.com/cpu: "0.5"
        run.googleapis.com/memory: "1Gi"
        run.googleapis.com/max-scale: "3"
        run.googleapis.com/min-scale: "1"
        run.googleapis.com/vpc-access-connector: "speculod-connector"
        run.googleapis.com/network-interfaces: '[{"network":"speculod-vpc","subnetwork":"speculod-subnet"}]'
    spec:
      containerConcurrency: 500
      timeoutSeconds: 60
      containers:
      - image: gcr.io/PROJECT_ID/speculod-faucet:latest
        name: speculod-faucet
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: DEPLOYMENT_MODE
          value: "faucet"
        - name: CHAIN_ID
          value: "speculod"
        - name: TENDERMINT_RPC_URL
          value: "http://speculod-validator.speculod.internal:8080/rpc"
        - name: FAUCET_AMOUNT
          value: "1000000"        # Amount per request
        - name: FAUCET_COOLDOWN
          value: "3600"           # 1 hour cooldown
        - name: CORS_ENABLED
          value: "true"
        resources:
          limits:
            cpu: "0.5"
            memory: "1Gi"
          requests:
            cpu: "0.25"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      serviceAccountName: speculod-faucet-sa
