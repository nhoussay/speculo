apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: speculod-tendermint
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      containers:
      - image: gcr.io/speculo-blockchain/speculod-tendermint:v1
        name: tendermint
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
        ports:
        - containerPort: 8080
        env:
        - name: SPECULOD_HOME
          value: "/home/speculod/.speculod"
        - name: SPECULOD_CHAIN_ID
          value: "speculod-chain"
