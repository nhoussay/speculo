steps:
# Build the persistent Tendermint node image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build', 
    '-f', 'Dockerfile.blockchain',
    '-t', 'gcr.io/$PROJECT_ID/speculod-persistent-node:$BUILD_ID',
    '-t', 'gcr.io/$PROJECT_ID/speculod-persistent-node:latest',
    '.'
  ]
  
# Push both tags
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/speculod-persistent-node:$BUILD_ID']
  
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/speculod-persistent-node:latest']

# Deploy to Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args: [
    'run', 'deploy', 'speculo-persistent-node-1',
    '--image', 'gcr.io/$PROJECT_ID/speculod-persistent-node:$BUILD_ID',
    '--region', 'europe-west1',
    '--platform', 'managed',
    '--allow-unauthenticated',
    '--port', '26657',
    '--memory', '2Gi',
    '--cpu', '2',
    '--timeout', '3600',
    '--concurrency', '1000',
    '--max-instances', '1',
    '--min-instances', '1',
    '--set-env-vars', 'SERVICE_TYPE=all,NODE_TYPE=persistent,CHAIN_ID=speculod-local-1,MONIKER=speculo-persistent-node-1,HOME_DIR=/home/speculod/.speculod,KEYRING_BACKEND=test,GITHUB_REPO=nhoussay/speculo,GITHUB_BRANCH=main,NETWORK_NAME=local-testnet,P2P_LADDR=tcp://0.0.0.0:26656,RPC_LADDR=tcp://0.0.0.0:26657,MAX_NUM_INBOUND_PEERS=100,MAX_NUM_OUTBOUND_PEERS=50',
    '--vpc-connector', 'projects/$PROJECT_ID/locations/europe-west1/connectors/speculod-vpc-connector',
    '--vpc-egress', 'all-traffic'
  ]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  
images:
- 'gcr.io/$PROJECT_ID/speculod-persistent-node:$BUILD_ID'
- 'gcr.io/$PROJECT_ID/speculod-persistent-node:latest'

substitutions:
  _SERVICE_NAME: 'speculo-persistent-node-1'
  _REGION: 'europe-west1'
