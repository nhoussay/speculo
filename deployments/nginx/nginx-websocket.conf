worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;

    # Map to determine if connection is WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream servers for blockchain services
    upstream rpc_backend {
        server speculod:26657;
    }

    upstream api_backend {
        server speculod:1317;
    }

    upstream grpc_backend {
        server speculod:9090;
    }

    # WebSocket P2P bridge backend
    upstream p2p_ws_backend {
        server websocket-bridge:8081;
    }

    # Main server block
    server {
        listen 8080;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # P2P endpoint information
        location /p2p/info {
            return 200 '{
                "p2p_enabled": true,
                "p2p_endpoint": "wss://domain/",
                "p2p_protocol": "websocket",
                "node_id": "get from /status endpoint",
                "connection_instructions": "Connect WebSocket to wss://domain/ for P2P bridge"
            }';
            add_header Content-Type application/json;
        }

        # RPC endpoints (Tendermint RPC)
        location /rpc/ {
            proxy_pass http://rpc_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for RPC subscriptions
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Direct RPC access (alternative path)
        location ~ ^/(status|health|abci_info|genesis|validators|block|blockchain|tx|tx_search|abci_query)$ {
            proxy_pass http://rpc_backend/$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API endpoints (Cosmos SDK REST)
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Direct REST API access for Cosmos SDK endpoints
        location ~ ^/(cosmos|ibc|speculod)/ {
            proxy_pass http://api_backend$uri$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization";
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # gRPC-Web proxy (for gRPC over HTTP/1.1)
        location /grpc/ {
            grpc_pass grpc://grpc_backend;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
            
            # CORS for gRPC-Web
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, grpc-timeout";
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # WebSocket P2P proxy at root - matches WebSocket upgrade requests
        location @websocket_p2p {
            proxy_pass http://p2p_ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
            
            # Disable buffering for real-time communication
            proxy_buffering off;
        }

        # Root endpoint - handles both WebSocket P2P and HTTP documentation
        location / {
            # Check for WebSocket upgrade header
            if ($http_upgrade = websocket) {
                error_page 418 = @websocket_p2p;
                return 418;
            }
            
            # Default response for HTTP requests - API documentation
            return 200 '{
                "name": "Speculod Multi-Service Proxy with WebSocket P2P",
                "version": "3.0.0",
                "endpoints": {
                    "p2p": {
                        "description": "Tendermint P2P over WebSocket",
                        "endpoint": "wss://domain/",
                        "protocol": "websocket",
                        "usage": "Connect WebSocket client to root path for P2P bridge"
                    },
                    "rpc": {
                        "description": "Tendermint RPC endpoints",
                        "paths": ["/rpc/*", "/status", "/health", "/genesis", "/validators", "/block/*"],
                        "examples": ["/status", "/rpc/status", "/genesis"]
                    },
                    "api": {
                        "description": "Cosmos SDK REST API",
                        "paths": ["/api/*", "/cosmos/*", "/ibc/*", "/speculod/*"],
                        "examples": ["/cosmos/bank/v1beta1/supply", "/api/cosmos/bank/v1beta1/supply"]
                    },
                    "grpc": {
                        "description": "gRPC services",
                        "paths": ["/grpc/*"],
                        "note": "Use gRPC-Web client for browser access"
                    },
                    "health": "/health"
                }
            }';
            add_header Content-Type application/json;
        }
    }
}
