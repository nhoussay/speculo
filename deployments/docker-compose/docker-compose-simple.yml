version: '3.8'

services:
  speculod:
    build:
      context: .
      dockerfile: Dockerfile.blockchain
    ports:
      - "8080:8080"   # RPC & P2P
      - "1317:1317"   # REST API
      - "9090:9090"   # gRPC
    environment:
      - PORT=8080
      - CHAIN_ID=speculod
      - MONIKER=speculod-node
      - HOME_DIR=/home/speculod/.speculod
      - KEYRING_BACKEND=test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - speculod_data:/home/speculod/.speculod
    restart: unless-stopped

volumes:
  speculod_data:

networks:
  default:
    name: speculod-network
