version: '3.8'

services:
  # Single-Port Speculod Node with Nginx Proxy + WebSocket P2P Bridge
  speculod-single-port:
    build:
      context: .
      dockerfile: Dockerfile.single-port
    container_name: speculod-single-port
    hostname: speculod-single-port
    environment:
      # Validator Configuration
      - NODE_TYPE=validator
      - SERVICE_TYPE=all-in-one
      - CHAIN_ID=speculod-local-1
      - MONIKER=single-port-validator
      - NODE_HOME=/home/speculod/.speculod
      - NETWORK=local
      - MINIMUM_GAS_PRICES=0.001stake
      
      # Validator specific settings
      - VALIDATOR_KEY_NAME=validator
      - ENABLE_VALIDATOR=true
      - GENESIS_VALIDATOR=true
      
      # Network settings - Internal ports
      - RPC_LADDR=tcp://127.0.0.1:26657
      - P2P_LADDR=tcp://127.0.0.1:26656
      - GRPC_LADDR=127.0.0.1:9090
      - API_ADDRESS=tcp://127.0.0.1:1317
      
      # Disable external peer connections - single node setup
      - PERSISTENT_PEERS=""
      - SEEDS=""
      - ENABLE_STATE_SYNC=false
      - SKIP_GENESIS_DOWNLOAD=true
      
      # Performance settings
      - PRUNING=nothing
      - SNAPSHOT_INTERVAL=1000
      - SNAPSHOT_KEEP_RECENT=2
      
      # Nginx Configuration
      - NGINX_PORT=8080
      - NGINX_WORKER_PROCESSES=2
      - NGINX_WORKER_CONNECTIONS=1024
      
    ports:
      - "8080:8080"    # Single port - All services via Nginx proxy
    networks:
      - speculod-single
    volumes:
      - ./scripts:/app/scripts
      - ./config:/app/config  
      - single_port_data:/home/speculod/.speculod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  speculod-single:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16

volumes:
  single_port_data:
    driver: local
