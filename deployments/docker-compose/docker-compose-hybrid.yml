version: '3.8'

# Hybrid Peer Node - connects to Google Cloud persistent node
# This demonstrates cloud-local hybrid blockchain architecture

services:
  # Local Peer Node connecting to Google Cloud
  hybrid-peer-local:
    build:
      context: .
      dockerfile: Dockerfile.blockchain
    container_name: speculod-hybrid-peer
    ports:
      - "26670:26656"  # P2P port (unique)
      - "26671:26657"  # RPC port (unique)
      - "1321:8080"    # REST API port (unique)
    environment:
      - SERVICE_TYPE=all
      - NODE_TYPE=peer
      - CHAIN_ID=speculod-local-1
      - MONIKER=speculod-hybrid-peer-local
      - HOME_DIR=/home/speculod/.speculod
      - KEYRING_BACKEND=test
      - P2P_LADDR=tcp://0.0.0.0:26656
      - RPC_LADDR=tcp://0.0.0.0:26657
      - PORT=8080
      # Connect to Google Cloud persistent node
      # Note: Cloud Run doesn't expose P2P ports, so this is for demonstration
      # In production, you'd use a different cloud service that supports custom ports
      - PERSISTENT_PEER_HOST=speculo-persistent-hybrid-7yu3badbja-ew.a.run.app
      - PERSISTENT_PEER_PORT=26656
      - MAX_NUM_INBOUND_PEERS=40
      - MAX_NUM_OUTBOUND_PEERS=10
      # Use GitHub-hosted genesis (same as cloud node)
      - GITHUB_REPO=nhoussay/speculo
      - GITHUB_BRANCH=main
      - NETWORK_NAME=local-testnet
      # Special configuration for hybrid mode
      - HYBRID_MODE=true
      - CLOUD_RPC_ENDPOINT=https://speculo-persistent-hybrid-7yu3badbja-ew.a.run.app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/cosmos/base/tendermint/v1beta1/node_info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - hybrid_peer_data:/home/speculod/.speculod
      - ./scripts/blockchain-service-github.sh:/scripts/blockchain-service-github.sh:ro
    networks:
      - speculod-hybrid-network
    command: ["/scripts/blockchain-service-github.sh"]

volumes:
  hybrid_peer_data:

networks:
  speculod-hybrid-network:
    driver: bridge
