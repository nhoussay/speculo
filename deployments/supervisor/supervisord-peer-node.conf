[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[unix_http_server]
file=/run/supervisord.sock
chmod=0700
username=supervisor
password=supervisor

[supervisorctl]
serverurl=unix:///run/supervisord.sock
username=supervisor
password=supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Nginx reverse proxy
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
user=root
priority=100

# WebSocket to P2P bridge
[program:websocket-bridge]
command=node /app/scripts/websocket-bridge.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/websocket-bridge.log
stderr_logfile=/var/log/supervisor/websocket-bridge.log
user=speculod
environment=PORT=3001,P2P_HOST=127.0.0.1,P2P_PORT=26656
priority=200

# Speculod peer node
[program:speculodd-peer]
command=/app/scripts/peer-node-start.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/speculodd-peer.log
stderr_logfile=/var/log/supervisor/speculodd-peer.log
user=root
priority=300
environment=NODE_HOME="/home/speculod/.speculod",CHAIN_ID="speculod-local-1",MONIKER="peer-node",VALIDATOR_KEY_NAME="peer",API_ADDRESS="tcp://127.0.0.1:1317",GRPC_LADDR="127.0.0.1:9090",RPC_LADDR="tcp://127.0.0.1:26657",P2P_LADDR="tcp://127.0.0.1:26656",PERSISTENT_PEERS="6bfaed9a290c20f4921523558b2a1839fab0105f@speculod-single-port:26656",IS_VALIDATOR="false"
