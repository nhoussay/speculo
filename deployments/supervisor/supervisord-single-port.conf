[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:speculodd]
command=/app/scripts/single-port-start.sh
user=speculod
directory=/home/speculod
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/speculodd.log
stderr_logfile=/var/log/supervisor/speculodd.log
environment=HOME="/home/speculod",USER="speculod"

[program:websocket-bridge]
command=/app/scripts/websocket-bridge.js
user=speculod
directory=/home/speculod
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/websocket-bridge.log
stderr_logfile=/var/log/supervisor/websocket-bridge.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log
