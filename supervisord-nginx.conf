[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:speculodd]
command=/app/scripts/blockchain-service-nginx.sh
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/speculodd.err.log
stdout_logfile=/var/log/supervisor/speculodd.out.log
user=root
environment=HOME="/home/speculod",USER="speculod"

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log
user=root
priority=200
