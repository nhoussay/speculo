version: '3.8'

services:
  speculod-test-peer:
    build: .
    container_name: speculod-test-peer
    ports:
      - "26680:26656"  # P2P port
      - "26681:26657"  # RPC port
      - "1322:1317"    # REST API port
    volumes:
      - speculod-test-peer-data:/home/speculod/.speculod
      - ./scripts:/scripts:ro
      - ./networks:/networks:ro
    environment:
      - NODE_TYPE=peer
      - SERVICE_TYPE=all
      - CHAIN_ID=speculod-mainnet-1
      - MONIKER=speculo-test-peer-dynamic
      - HOME_DIR=/home/speculod/.speculod
      - P2P_LADDR=tcp://0.0.0.0:26656
      - RPC_LADDR=tcp://0.0.0.0:26657
      - GRPC_ADDRESS=0.0.0.0:9090
      - API_ADDRESS=0.0.0.0:1317
      - NETWORK_NAME=mainnet
    restart: unless-stopped
    networks:
      - speculod-test
    command: ["/scripts/blockchain-service-dynamic.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  speculod-test:
    driver: bridge
    name: speculod-test-network

volumes:
  speculod-test-peer-data:
