apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: speculod-blockchain
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu: "2"
        run.googleapis.com/memory: "4Gi"
        run.googleapis.com/max-scale: "1"
        run.googleapis.com/min-scale: "1"
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 3600
      containers:
      - image: gcr.io/PROJECT_ID/speculod:latest
        name: speculod
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: CHAIN_ID
          value: "speculod"
        - name: MONIKER
          value: "speculod-gcp"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: speculod-data
          mountPath: /home/speculod/.speculod
      volumes:
      - name: speculod-data
        emptyDir: {}
      serviceAccountName: speculod-service-account
