apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: speculod-api
  labels:
    component: blockchain-api
    app: speculod
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      labels:
        component: blockchain-api
        app: speculod
      annotations:
        run.googleapis.com/cpu: "1"
        run.googleapis.com/memory: "2Gi"
        run.googleapis.com/max-scale: "5"     # Can scale up for API requests
        run.googleapis.com/min-scale: "1"     # Always one instance
        run.googleapis.com/vpc-access-connector: "speculod-connector"
        run.googleapis.com/network-interfaces: '[{"network":"speculod-vpc","subnetwork":"speculod-subnet"}]'
    spec:
      containerConcurrency: 1000
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/speculod-api:latest
        name: speculod-api
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: DEPLOYMENT_MODE
          value: "api"
        - name: CHAIN_ID
          value: "speculod"
        - name: MONIKER
          value: "speculod-api-gcp"
        - name: TENDERMINT_RPC_URL
          value: "http://speculod-validator.speculod.internal:8080/rpc"
        - name: API_ENABLE
          value: "true"
        - name: GRPC_ENABLE
          value: "true"
        - name: SWAGGER_ENABLE
          value: "true"
        - name: CORS_ENABLED
          value: "true"
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "0.5"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      serviceAccountName: speculod-api-sa
